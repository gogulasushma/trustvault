{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  <p><label>Username <input name="username" required></label></p>
  <p><label>Password <input name="password" type="password" required></label></p>
  <button type="submit">Log in</button>
</form>
<p><a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
